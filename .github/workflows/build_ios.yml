name: Build iOS IPA Unsigned

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate iOS Project Scaffold if missing
        run: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Recreating iOS scaffolding..."
            flutter create . --platforms=ios --org com.antigravity
          fi

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r MixingPumpSCADA.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixingPumpSCADA-IPA
          path: build/ios/iphoneos/MixingPumpSCADA.ipa
